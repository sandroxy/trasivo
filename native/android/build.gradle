import groovy.json.JsonSlurper
plugins { id "com.android.library" version "8.12.3" apply false }
ext.trasivoManifest = new JsonSlurper().parse(file("../../plugin.json"))
subprojects {
    apply plugin: "com.android.library"
    apply plugin: "maven-publish"
    group = rootProject.ext.trasivoManifest.native.android.group
    version = rootProject.ext.trasivoManifest.version
    android {
        namespace = "com.sandrox." + project.name.replace('-', '.')
        compileSdk = rootProject.ext.trasivoManifest.native.android.compileSdk
        defaultConfig { minSdk = rootProject.ext.trasivoManifest.native.android.minimumSdk }
        compileOptions { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
        publishing { singleVariant("release") { withSourcesJar() } }
    }
    afterEvaluate {
        publishing {
            publications {
                release(MavenPublication) {
                    from components.release
                    artifactId = project.name
                    pom {
                        name = project.name
                        description = "Native file transfer toolkit"
                        url = "https://github.com/sandroxy/trasivo"
                        licenses { license { name = "Apache License, Version 2.0"; url = "https://www.apache.org/licenses/LICENSE-2.0.txt" } }
                        developers { developer { id = "sandroxy"; name = "SandroX" } }
                        scm { url = "https://github.com/sandroxy/trasivo.git" }
                    }
                }
            }
            repositories { maven { url = rootProject.layout.buildDirectory.dir("maven") } }
        }
    }
}
